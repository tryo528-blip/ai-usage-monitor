[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-usage-monitor"
version = "0.1.0"
description = "Local desktop dashboard for AI usage quotas and balances"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "keyring>=25,<26",
  "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-qt>=4.4,<5",
  "respx>=0.21,<1",
  "ruff>=0.5,<1",
  "PyInstaller>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
